; NickelKoSync configuration.
; Copy this file to config.ini in the same folder and edit it. The file is
; re-read whenever it changes, no reboot needed.

[server]
; KOReader sync server. The official one is https://sync.koreader.rocks ;
; self-hosted koreader-sync-server and crosspoint-sync instances work too.
url = https://sync.koreader.rocks
; The account you also use in KOReader / CrossPoint. Either the plain
; password or its MD5 (password_md5 = ...) can be given; the server only ever
; sees the MD5, as with KOReader.
username =
password =
; How this device is named in "Sync to latest location from device ..."
; messages on your other readers.
device = Kobo
; Accept any TLS certificate (only for a self-hosted server without a valid
; certificate), or add a PEM file with your own CA.
insecure = false
; ca_file = /mnt/onboard/.adds/kosync/my-ca.pem

[sync]
; How books are matched across devices, exactly as in KOReader's settings:
;   binary    a checksum of the file's content (KOReader's default). The
;             same file must be on every device.
;   filename  a checksum of the file name only.
document_id = binary
; When a newer position from another device arrives:
;   newer    always move there, even backwards (newest wins, like KOReader's
;            "silent" sync in both directions)
;   forward  only when it is further into the book
;   off      never move; only push this device's progress
pull = newer
; Push this device's progress (set to false for a read-only device).
push = true
; How many recently read books are checked on each sync (1-20).
recent_books = 3
; While the device is awake and online, check the server this often (minutes).
pull_interval_minutes = 15
; Send the file name, title and author with each push (ignored by the
; official server, used by some self-hosted ones).
send_metadata = false
; Check a book against the server when it is opened, and when the device
; wakes with it open. A newer position from another device then reaches
; Kobalt's "position changed elsewhere" prompt within a minute.
on_open = true
; When the device goes to sleep with a book open whose position has not been
; sent yet, keep it awake up to this many seconds so the position can go out
; (turning Wi-Fi on if needed). 0 lets the device sleep at once; the position
; is then sent at the next connection.
hold_sleep_seconds = 20

[wifi]
; connect  ask Nickel to turn Wi-Fi on when there is something to sync and
;          the device is offline (Nickel turns it off again by itself)
; keep     never touch Wi-Fi; sync whenever it happens to be on (for example
;          after tapping Sync on the home screen)
mode = connect
; Do not ask for Wi-Fi more often than this (minutes).
cooldown_minutes = 10

[options]
; Show Nickel's notification bubble after a sync (what moved, what was sent).
notify = true
; With NickelMenu installed, add a "KOSync" entry to the main menu that opens
; the KOSync screen (sync buttons and these settings).
menu = true
; Also add a "KOSync log" entry that shows the last lines of log.txt.
menu_log = false
; "Check whole library" on the KOSync screen covers at most this many books.
max_books = 300
; Write every decision to log.txt in this folder.
verbose = false
